name: Build VAMPIR Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract VAMPIR source
        run: |
          mkdir -p appsrc
          unzip -q VAMPIR_ANDROID_BUILD_SOURCE.zip -d appsrc

      - name: Build APK
        working-directory: appsrc
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifact
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk artifact/VAMPIR-Android-Beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAMPIR-Android-Beta
          path: artifact/VAMPIR-Android-Beta.apk
          if-no-files-found: error
          retention-days: 30
